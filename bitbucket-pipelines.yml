image: mcr.microsoft.com/dotnet/sdk:10.0

definitions:
  steps:
    - step: &test-and-package
        name: Test and build the sample package
        script:
          # The tests publish the sample package themselves. The installer tests are skipped on Linux.
          - dotnet test
          # A parameter with no value would otherwise wait for input until the step times out.
          - export ASPIRE_INTERACTIVITY_ENABLED=false
          - export Parameters__greeting="Hello from the pipeline"
          # "--clear-cache true" keeps a runner from reusing parameter values that an earlier build saved.
          - dotnet run --project samples/Sample.AppHost -- --operation publish --step publish --output-path artifacts --clear-cache true
        artifacts:
          - artifacts/handoff/**

    - step: &install-on-windows
        name: Install the sample package (self-hosted Windows runner)
        runs-on:
          - self.hosted
          - windows
        script:
          # The runner must run elevated, or the tests that install the service are skipped.
          - dotnet test

pipelines:
  default:
    - step: *test-and-package

  custom:
    install-on-windows:
      - step: *install-on-windows
